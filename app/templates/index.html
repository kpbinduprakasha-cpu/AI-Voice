<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Voice Assistant — Powered by Google Gemini</title>
    <meta name="theme-color" content="#131314" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <!-- Top Bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="nav-pills">
          <button class="nav-pill active" id="tabChat" type="button">Chat</button>
          <button class="nav-pill" id="tabWork" type="button">+ Work</button>
        </div>
      </div>
      <div class="header-center">
        <span class="brand-tag">
          <svg class="gemini-star" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
          </svg>
          Google Gemini Assistant
        </span>
      </div>
      <div class="header-right">
        <div class="provider-badge" id="providerBadge" title="Click to view provider settings">
          <span class="status-dot"></span>
          <span id="providerName">Gemini 3.8 Flash</span>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="chat-container">
      <!-- Welcome Hero (shown when no messages) -->
      <section class="welcome-hero" id="welcomeHero">
        <h1 class="hero-title">What's on your mind today?</h1>
      </section>

      <!-- Message History Thread -->
      <section class="messages-thread hidden" id="messagesThread" aria-live="polite">
        <!-- Messages will be injected here -->
      </section>

      <!-- Hidden Audio Player for synthesized speech -->
      <audio id="audioPlayer" preload="auto"></audio>
    </main>

    <!-- Bottom Dock / Chat & Voice Bar (ChatGPT / Gemini style) -->
    <footer class="dock-container">
      <div class="dock-wrapper">
        <!-- Error Banner -->
        <div class="error-toast hidden" id="errorToast" role="alert">
          <span class="error-icon">⚠️</span>
          <span id="errorMessage"></span>
          <button class="toast-close" id="toastClose" type="button" aria-label="Dismiss">&times;</button>
        </div>

        <!-- Recording HUD overlay -->
        <div class="recording-hud hidden" id="recordingHud">
          <div class="pulse-ring"></div>
          <span class="hud-status">Listening…</span>
          <span class="hud-timer" id="recordingTimer">00:00</span>
          <div class="wave-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <button class="hud-cancel" id="cancelRecordingBtn" type="button">Cancel</button>
          <button class="hud-stop" id="finishRecordingBtn" type="button">Done</button>
        </div>

        <!-- Input Pill Bar -->
        <div class="input-pill" id="inputPill">
          <!-- Plus / Upload button -->
          <label class="icon-btn upload-label" title="Attach audio file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <input id="audioFileInput" type="file" accept="audio/*,video/webm,.wav,.mp3,.webm,.ogg,.m4a" hidden />
          </label>

          <!-- Text Input -->
          <textarea
            id="textInput"
            class="chat-textarea"
            rows="1"
            placeholder="Ask Gemini or start speaking…"
            aria-label="Message input"
          ></textarea>

          <!-- Think Toggle Button -->
          <button class="pill-btn think-btn" id="thinkBtn" type="button" title="Deep Reasoning Mode">
            <svg class="brain-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-5.04z"/>
              <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-5.04z"/>
            </svg>
            <span>Think</span>
          </button>

          <!-- Mic button (Record Voice) -->
          <button class="icon-btn mic-btn" id="micBtn" type="button" title="Speak to Gemini" aria-label="Microphone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </button>

          <!-- Blue Waveform / Live Voice Button (as shown in ChatGPT/Gemini screenshot) -->
          <button class="waveform-btn" id="liveVoiceBtn" type="button" title="Live Voice Mode" aria-label="Start Voice Mode">
            <div class="wave-graphic">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </button>
        </div>

        <!-- Suggestion Chips (matching screenshot) -->
        <div class="suggestion-chips" id="suggestionChips">
          <button class="chip" data-prompt="Help me write and edit a clear summary of this topic:" type="button">
            <span class="chip-icon">✏️</span>
            <span>Write or edit</span>
          </button>
          <button class="chip" data-prompt="Search and explain the latest developments in AI:" type="button">
            <span class="chip-icon">🌐</span>
            <span>Search or explain</span>
          </button>
          <button class="chip" data-prompt="Explain this concept in simple terms for a beginner:" type="button">
            <span class="chip-icon">💡</span>
            <span>Explain simply</span>
          </button>
          <button class="chip" id="clearChatChip" type="button" title="Clear conversation">
            <span class="chip-icon">🗑️</span>
            <span>Clear chat</span>
          </button>
        </div>
      </div>
    </footer>

    <script src="/static/js/app.js"></script>
  </body>
</html>
