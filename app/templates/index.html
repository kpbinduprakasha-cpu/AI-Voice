<!DOCTYPE html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>K P Air — AI Voice Assistant</title>
    <meta name="theme-color" content="#18181b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <!-- Top Bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-tag">
          <span class="status-pulse"></span>
          <span class="brand-name">K P Air</span>
        </div>
      </div>
      <div class="header-center">
        <div class="header-chat-title">
          <span class="chat-status-pill">Online Chat</span>
        </div>
      </div>
      <div class="header-right">
        <!-- Day / Night Theme Toggle -->
        <button class="theme-toggle-btn" id="themeToggle" type="button" title="Switch Day/Night mode">
          <span class="theme-icon" id="themeIcon">🌙</span>
          <span class="theme-text" id="themeText">Night</span>
        </button>
        <!-- Engine Status Badge -->
        <div class="provider-badge" id="providerBadge" title="Engine Status">
          <span class="status-dot"></span>
          <span id="providerName">K P Air AI</span>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="chat-container">
      <!-- Welcome Hero (shown when no messages, clean without images) -->
      <section class="welcome-hero" id="welcomeHero">
        <div class="hero-badge">Voice & Text AI</div>
        <h1 class="hero-title">K P Air</h1>
        <p class="hero-subtitle">What's on your mind today?</p>
      </section>

      <!-- Message History Thread (Messenger style left/right bubbles) -->
      <section class="messages-thread hidden" id="messagesThread" aria-live="polite">
        <!-- Chat bubbles will be injected here -->
      </section>

      <!-- Hidden Audio Player for synthesized speech -->
      <audio id="audioPlayer" preload="auto"></audio>

      <!-- Scroll to Bottom Arrow Button (matching screenshot) -->
      <button class="scroll-bottom-btn hidden" id="scrollBottomBtn" type="button" aria-label="Scroll to bottom" title="Scroll to bottom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </main>

    <!-- Bottom Dock / Chat & Voice Bar -->
    <footer class="dock-container">
      <div class="dock-wrapper">
        <!-- Error Banner -->
        <div class="error-toast hidden" id="errorToast" role="alert">
          <span class="error-icon">⚠️</span>
          <span id="errorMessage"></span>
          <button class="toast-close" id="toastClose" type="button" aria-label="Dismiss">&times;</button>
        </div>

        <!-- Recording HUD overlay -->
        <div class="recording-hud hidden" id="recordingHud">
          <div class="pulse-ring"></div>
          <span class="hud-status">Listening…</span>
          <span class="hud-timer" id="recordingTimer">00:00</span>
          <div class="wave-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <button class="hud-cancel" id="cancelRecordingBtn" type="button">Cancel</button>
          <button class="hud-stop" id="finishRecordingBtn" type="button">Done</button>
        </div>

        <!-- Input Pill Bar -->
        <div class="input-pill" id="inputPill">
          <!-- Plus / Upload button -->
          <label class="icon-btn upload-label" title="Attach audio file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <input id="audioFileInput" type="file" accept="audio/*,video/webm,.wav,.mp3,.webm,.ogg,.m4a" hidden />
          </label>

          <!-- Text Input -->
          <textarea
            id="textInput"
            class="chat-textarea"
            rows="1"
            placeholder="Ask K P Air or start speaking…"
            aria-label="Message input"
          ></textarea>

          <!-- Mic button (Record Voice) -->
          <button class="icon-btn mic-btn" id="micBtn" type="button" title="Speak to K P Air" aria-label="Microphone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </button>

          <!-- Blue Waveform / Live Voice Button -->
          <button class="waveform-btn" id="liveVoiceBtn" type="button" title="Live Voice Mode" aria-label="Start Voice Mode">
            <div class="wave-graphic">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </button>
        </div>

        <!-- Suggestion Chips -->
        <div class="suggestion-chips" id="suggestionChips">
          <button class="chip" data-prompt="Help me write and edit a clear summary of this topic:" type="button">
            <span class="chip-icon">✏️</span>
            <span>Write or edit</span>
          </button>
          <button class="chip" data-prompt="Search and explain the latest developments in AI:" type="button">
            <span class="chip-icon">🌐</span>
            <span>Search or explain</span>
          </button>
          <button class="chip" data-prompt="Explain this concept in simple terms for a beginner:" type="button">
            <span class="chip-icon">💡</span>
            <span>Explain simply</span>
          </button>
          <button class="chip" id="clearChatChip" type="button" title="Clear conversation">
            <span class="chip-icon">🗑️</span>
            <span>Clear chat</span>
          </button>
        </div>
      </div>
    </footer>

    <!-- Dedicated Live Voice Mode Page / Screen (Matching Screenshot) -->
    <div class="live-voice-page hidden" id="liveVoicePage" role="dialog" aria-modal="true" aria-label="Live Voice Mode">
      <!-- Ambient background lighting -->
      <div class="live-voice-bg"></div>

      <!-- Top Header Bar -->
      <header class="live-voice-header">
        <button class="live-voice-exit-btn" id="liveVoiceExitBtn" type="button" aria-label="Exit Live Voice" title="Back to Chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Chat</span>
        </button>

        <!-- Top Timer (matching screenshot ⏱ 00:00:45) -->
        <div class="live-voice-timer-badge">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="liveVoiceTimer">00:00:00</span>
        </div>

        <div class="live-voice-status-pill" id="liveVoiceStatusPill">
          <span class="live-status-dot"></span>
          <span id="liveVoiceStatusText">Ready</span>
        </div>
      </header>

      <!-- Center Waveform Visualization Section -->
      <main class="live-voice-main">
        <div class="live-wave-container">
          <canvas id="liveVoiceWaveCanvas" width="900" height="340"></canvas>
        </div>

        <!-- Live Subtitle / Feedback Pill -->
        <div class="live-subtitle-container" id="liveSubtitleContainer">
          <p class="live-subtitle-text" id="liveSubtitleText">Tap the microphone to speak with K P Air</p>
        </div>
      </main>

      <!-- Bottom Microphone Button Section (Matching Screenshot) -->
      <footer class="live-voice-footer">
        <div class="live-mic-wrapper">
          <!-- Concentric pulsing glowing ripple rings -->
          <div class="live-mic-ripple live-ripple-1"></div>
          <div class="live-mic-ripple live-ripple-2"></div>
          <div class="live-mic-ripple live-ripple-3"></div>
          <div class="live-mic-ripple live-ripple-4"></div>

          <!-- Central Gradient Microphone Button with Motion -->
          <button class="live-main-mic-btn" id="liveMainMicBtn" type="button" aria-label="Toggle Live Microphone" title="Tap to speak / finish">
            <svg class="live-mic-svg" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </button>
        </div>
        <div class="live-mic-hint" id="liveMicHint">Tap to speak</div>
      </footer>
    </div>

    <script src="/static/js/app.js"></script>
  </body>
</html>
